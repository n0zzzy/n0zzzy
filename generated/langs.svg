<svg xmlns="http://www.w3.org/2000/svg" width="495" height="215" viewBox="0 0 495 215">
<defs>
  <linearGradient id="cbg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#06080c"/><stop offset=".6" stop-color="#0b0a10"/><stop offset="1" stop-color="#1c0609"/></linearGradient>
  <radialGradient id="cglow" cx="1" cy="0" r=".9"><stop offset="0" stop-color="#dc2626" stop-opacity=".25"/><stop offset="1" stop-color="#dc2626" stop-opacity="0"/></radialGradient>
  <pattern id="cgrid" width="26" height="26" patternUnits="userSpaceOnUse"><path d="M26 0 L0 0 0 26" fill="none" stroke="#dc2626" stroke-opacity=".07"/></pattern>
  <pattern id="cscan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#000" fill-opacity=".35"/></pattern>
  <clipPath id="cclip"><rect width="495" height="215" rx="10"/></clipPath>
</defs>
<style>
  .t { font: 600 11px 'Fira Code', Consolas, monospace; fill: #dc2626; letter-spacing: 2px; text-transform: uppercase; }
  .l { font: 400 13px 'Segoe UI', Ubuntu, 'Helvetica Neue', Sans-Serif; fill: #8b949e; }
  .v { font: 700 14px 'Segoe UI', Ubuntu, 'Helvetica Neue', Sans-Serif; fill: #e6edf3; }
  .big { font: 800 40px 'Segoe UI', Ubuntu, 'Helvetica Neue', Sans-Serif; fill: #e6edf3; }
  .fade { animation: fade .6s ease-out; }
  .sweep { animation: sweep 5s linear infinite; }
  .pulse { animation: pulse 2.6s ease-in-out infinite; }
  @keyframes fade { from { opacity: 0; transform: translateX(-6px); } to { opacity: 1; transform: none; } }
  @keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  @keyframes ring { from { stroke-dashoffset: 251; } }
  @keyframes sweep { from { transform: translateY(-40px); } to { transform: translateY(255px); } }
  @keyframes pulse { 50% { stroke-opacity: .25; } }
</style>
<g clip-path="url(#cclip)">
  <rect width="495" height="215" fill="url(#cbg)"/>
  <rect width="495" height="215" fill="url(#cgrid)"/>
  <rect width="495" height="215" fill="url(#cglow)"/>
  <rect width="495" height="215" fill="url(#cscan)"/>
  <rect class="sweep" width="495" height="40" fill="#dc2626" fill-opacity=".05"/>
</g>
<rect x=".5" y=".5" width="494" height="214" rx="10" fill="none" stroke="#dc2626" stroke-opacity=".45" class="pulse"/>
<g stroke="#dc2626" stroke-width="3" fill="none"><path d="M2 20 V2 H20"/><path d="M475 2 H493 V20"/><path d="M2 195 V213 H20"/><path d="M475 213 H493 V195"/></g>
<text x="25" y="32" class="t">most used languages</text>
<defs><clipPath id="bar"><rect width="445" height="10" rx="5"/></clipPath></defs>
<g transform="translate(25, 60)">
  <g clip-path="url(#bar)"><g style="transform-origin: 0 0; animation: grow 1s ease-out"><rect x="0.00" y="0" width="185.07" height="10" fill="#3572A5"/><rect x="185.07" y="0" width="115.27" height="10" fill="#844FBA"/><rect x="300.34" y="0" width="54.31" height="10" fill="#f1e05a"/><rect x="354.66" y="0" width="49.73" height="10" fill="#3178c6"/><rect x="404.39" y="0" width="20.49" height="10" fill="#89e051"/><rect x="424.88" y="0" width="20.12" height="10" fill="#e34c26"/></g></g>
</g>
<g class="fade" transform="translate(25, 108)">
  <circle cx="5" cy="-4" r="5" fill="#3572A5"/>
  <text x="18" y="0" class="v">Python</text>
  <text x="200" y="0" class="l" text-anchor="end">41.6%</text>
</g>
<g class="fade" transform="translate(255, 108)">
  <circle cx="5" cy="-4" r="5" fill="#844FBA"/>
  <text x="18" y="0" class="v">HCL</text>
  <text x="200" y="0" class="l" text-anchor="end">25.9%</text>
</g>
<g class="fade" transform="translate(25, 136)">
  <circle cx="5" cy="-4" r="5" fill="#f1e05a"/>
  <text x="18" y="0" class="v">JavaScript</text>
  <text x="200" y="0" class="l" text-anchor="end">12.2%</text>
</g>
<g class="fade" transform="translate(255, 136)">
  <circle cx="5" cy="-4" r="5" fill="#3178c6"/>
  <text x="18" y="0" class="v">TypeScript</text>
  <text x="200" y="0" class="l" text-anchor="end">11.2%</text>
</g>
<g class="fade" transform="translate(25, 164)">
  <circle cx="5" cy="-4" r="5" fill="#89e051"/>
  <text x="18" y="0" class="v">Shell</text>
  <text x="200" y="0" class="l" text-anchor="end">4.6%</text>
</g>
<g class="fade" transform="translate(255, 164)">
  <circle cx="5" cy="-4" r="5" fill="#e34c26"/>
  <text x="18" y="0" class="v">HTML</text>
  <text x="200" y="0" class="l" text-anchor="end">4.5%</text>
