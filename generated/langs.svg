<svg xmlns="http://www.w3.org/2000/svg" width="495" height="215" viewBox="0 0 495 215">
<style>
  .t { font: 600 16px 'Segoe UI', Ubuntu, 'Helvetica Neue', Sans-Serif; fill: #dc2626; }
  .l { font: 400 13px 'Segoe UI', Ubuntu, 'Helvetica Neue', Sans-Serif; fill: #8b949e; }
  .v { font: 700 14px 'Segoe UI', Ubuntu, 'Helvetica Neue', Sans-Serif; fill: #e6edf3; }
  .big { font: 800 40px 'Segoe UI', Ubuntu, 'Helvetica Neue', Sans-Serif; fill: #e6edf3; }
  .fade { animation: fade .6s ease-out; }
  @keyframes fade { from { opacity: 0; transform: translateX(-6px); } to { opacity: 1; transform: none; } }
  @keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  @keyframes ring { from { stroke-dashoffset: 251; } }
</style>
<rect x="0.5" y="0.5" width="494" height="214" rx="10" fill="#0d1117" stroke="#30363d"/>
<rect x="0.5" y="0.5" width="4" height="214" rx="2" fill="#dc2626"/>
<text x="25" y="34" class="t">most used languages</text>
<defs><clipPath id="bar"><rect width="445" height="10" rx="5"/></clipPath></defs>
<g transform="translate(25, 60)">
  <g clip-path="url(#bar)"><g style="transform-origin: 0 0; animation: grow 1s ease-out"><rect x="0.00" y="0" width="194.13" height="10" fill="#3572A5"/><rect x="194.13" y="0" width="124.97" height="10" fill="#844FBA"/><rect x="319.09" y="0" width="53.92" height="10" fill="#3178c6"/><rect x="373.01" y="0" width="38.93" height="10" fill="#f1e05a"/><rect x="411.94" y="0" width="22.21" height="10" fill="#89e051"/><rect x="434.15" y="0" width="10.85" height="10" fill="#e34c26"/></g></g>
</g>
<g class="fade" transform="translate(25, 108)">
  <circle cx="5" cy="-4" r="5" fill="#3572A5"/>
  <text x="18" y="0" class="v">Python</text>
  <text x="200" y="0" class="l" text-anchor="end">43.6%</text>
</g>
<g class="fade" transform="translate(255, 108)">
  <circle cx="5" cy="-4" r="5" fill="#844FBA"/>
  <text x="18" y="0" class="v">HCL</text>
  <text x="200" y="0" class="l" text-anchor="end">28.1%</text>
</g>
<g class="fade" transform="translate(25, 136)">
  <circle cx="5" cy="-4" r="5" fill="#3178c6"/>
  <text x="18" y="0" class="v">TypeScript</text>
  <text x="200" y="0" class="l" text-anchor="end">12.1%</text>
</g>
<g class="fade" transform="translate(255, 136)">
  <circle cx="5" cy="-4" r="5" fill="#f1e05a"/>
  <text x="18" y="0" class="v">JavaScript</text>
  <text x="200" y="0" class="l" text-anchor="end">8.7%</text>
</g>
<g class="fade" transform="translate(25, 164)">
  <circle cx="5" cy="-4" r="5" fill="#89e051"/>
  <text x="18" y="0" class="v">Shell</text>
  <text x="200" y="0" class="l" text-anchor="end">5.0%</text>
</g>
<g class="fade" transform="translate(255, 164)">
  <circle cx="5" cy="-4" r="5" fill="#e34c26"/>
  <text x="18" y="0" class="v">HTML</text>
