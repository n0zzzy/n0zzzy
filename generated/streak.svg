<svg xmlns="http://www.w3.org/2000/svg" width="990" height="200" viewBox="0 0 990 200">
<defs>
  <linearGradient id="cbg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#06080c"/><stop offset=".6" stop-color="#0b0a10"/><stop offset="1" stop-color="#1c0609"/></linearGradient>
  <radialGradient id="cglow" cx="1" cy="0" r=".9"><stop offset="0" stop-color="#dc2626" stop-opacity=".25"/><stop offset="1" stop-color="#dc2626" stop-opacity="0"/></radialGradient>
  <pattern id="cgrid" width="26" height="26" patternUnits="userSpaceOnUse"><path d="M26 0 L0 0 0 26" fill="none" stroke="#dc2626" stroke-opacity=".07"/></pattern>
  <pattern id="cscan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#000" fill-opacity=".35"/></pattern>
  <clipPath id="cclip"><rect width="990" height="200" rx="10"/></clipPath>
</defs>
<style>
  .t { font: 600 11px 'Fira Code', Consolas, monospace; fill: #dc2626; letter-spacing: 2px; text-transform: uppercase; }
  .l { font: 400 13px 'Segoe UI', Ubuntu, 'Helvetica Neue', Sans-Serif; fill: #8b949e; }
  .v { font: 700 14px 'Segoe UI', Ubuntu, 'Helvetica Neue', Sans-Serif; fill: #e6edf3; }
  .big { font: 800 40px 'Segoe UI', Ubuntu, 'Helvetica Neue', Sans-Serif; fill: #e6edf3; }
  .fade { animation: fade .6s ease-out; }
  .sweep { animation: sweep 5s linear infinite; }
  .pulse { animation: pulse 2.6s ease-in-out infinite; }
  @keyframes fade { from { opacity: 0; transform: translateX(-6px); } to { opacity: 1; transform: none; } }
  @keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  @keyframes ring { from { stroke-dashoffset: 251; } }
  @keyframes sweep { from { transform: translateY(-40px); } to { transform: translateY(240px); } }
  @keyframes pulse { 50% { stroke-opacity: .25; } }
</style>
<g clip-path="url(#cclip)">
  <rect width="990" height="200" fill="url(#cbg)"/>
  <rect width="990" height="200" fill="url(#cgrid)"/>
  <rect width="990" height="200" fill="url(#cglow)"/>
  <rect width="990" height="200" fill="url(#cscan)"/>
  <rect class="sweep" width="990" height="40" fill="#dc2626" fill-opacity=".05"/>
</g>
<rect x=".5" y=".5" width="989" height="199" rx="10" fill="none" stroke="#dc2626" stroke-opacity=".45" class="pulse"/>
<g stroke="#dc2626" stroke-width="3" fill="none"><path d="M2 20 V2 H20"/><path d="M970 2 H988 V20"/><path d="M2 180 V198 H20"/><path d="M970 198 H988 V180"/></g>
<text x="25" y="32" class="t">contribution streak</text>
<g transform="translate(170, 0)">
  <rect x="-145" y="50" width="290" height="132" rx="8" fill="#0d1117" fill-opacity=".9" stroke="#dc2626" stroke-opacity="0.22"/>
  <text y="120" text-anchor="middle" style="font: 800 40px 'Segoe UI', Ubuntu, 'Helvetica Neue', Sans-Serif; fill: #e6edf3">391</text>
  <text y="80" text-anchor="middle" style="font: 600 11px 'Fira Code', Consolas, monospace; fill: #dc2626; letter-spacing: 2px">TOTAL CONTRIBUTIONS</text>
  <text y="160" text-anchor="middle" class="l">Jan 1, 2022 → present</text>
</g>
<g transform="translate(495, 0)">
  <rect x="-145" y="50" width="290" height="132" rx="8" fill="#0d1117" fill-opacity=".9" stroke="#dc2626" stroke-opacity="0.6"/>
  <text y="126" text-anchor="middle" style="font: 800 48px 'Segoe UI', Ubuntu, 'Helvetica Neue', Sans-Serif; fill: #dc2626">1</text>
  <text y="80" text-anchor="middle" style="font: 600 11px 'Fira Code', Consolas, monospace; fill: #fca5a5; letter-spacing: 2px">🔥 CURRENT STREAK</text>
  <text y="160" text-anchor="middle" class="l">Oct 31, 2026</text>
</g>
<g transform="translate(820, 0)">
  <rect x="-145" y="50" width="290" height="132" rx="8" fill="#0d1117" fill-opacity=".9" stroke="#dc2626" stroke-opacity="0.22"/>
  <text y="120" text-anchor="middle" style="font: 800 40px 'Segoe UI', Ubuntu, 'Helvetica Neue', Sans-Serif; fill: #e6edf3">12</text>
  <text y="80" text-anchor="middle" style="font: 600 11px 'Fira Code', Consolas, monospace; fill: #dc2626; letter-spacing: 2px">LONGEST STREAK</text>
  <text y="160" text-anchor="middle" class="l">Jan 17, 2026 → Jan 28, 2026</text>
</g>
</svg>