ll: #f0f6fc">LLM-as-a-Judge</text><rect x="294" y="207" width="155" height="20" rx="10" fill="#1a0507" stroke="#dc2626" stroke-opacity="0.7"/><text x="305" y="221" class="mrol" fill="#fca5a5" style="font-size:12px; font-weight:700">Claude Sonnet 4.5</text><text x="540" y="222" class="brol">scores agent outputs in evals</text><text x="850" y="222" class="mrol" fill="#9aa4b2" style="font-size:11.5px">eks</text><rect x="24" y="240" width="952" height="34" rx="6" fill="#0d1117" fill-opacity="0.95" stroke="#dc2626" stroke-opacity="0.15"/><text x="40" y="262" style="font: 600 14px 'Segoe UI', Ubuntu, 'Helvetica Neue', sans-serif; fill: #f0f6fc">Managed agent backbone</text><rect x="294" y="247" width="147" height="20" rx="10" fill="#1a0507" stroke="#dc2626" stroke-opacity="0.7"/><text x="305" y="261" class="mrol" fill="#fca5a5" style="font-size:12px; font-weight:700">Amazon Nova Lite</text><text x="540" y="262" class="brol">low-cost Bedrock serving</text><text x="850" y="262" class="mrol" fill="#9aa4b2" style="font-size:11.5px">eks</text><rect x="24" y="280" width="952" height="34" rx="6" fill="#0d1117" fill-opacity="0.75" stroke="#dc2626" stroke-opacity="0.15"/><text x="40" y="302" style="font: 600 14px 'Segoe UI', Ubuntu, 'Helvetica Neue', sans-serif; fill: #f0f6fc">Self-hosted agent</text><rect x="294" y="287" width="162" height="20" rx="10" fill="#1a0507" stroke="#dc2626" stroke-opacity="0.7"/><text x="305" y="301" class="mrol" fill="#fca5a5" style="font-size:12px; font-weight:700">Qwen 2.5 3B · vLLM</text><text x="540" y="302" class="brol">open-source on AWS Inferentia</text><text x="850" y="302" class="mrol" fill="#9aa4b2" style="font-size:11.5px">eks</text><rect x="24" y="320" width="952" height="34" rx="6" fill="#0d1117" fill-opacity="0.95" stroke="#dc2626" stroke-opacity="0.15"/><text x="40" y="342" style="font: 600 14px 'Segoe UI', Ubuntu, 'Helvetica Neue', sans-serif; fill: #f0f6fc">Tool-calling assistant</text><rect x="294" y="327" width="116" height="20" rx="10" fill="#1a0507" stroke="#dc2626" stroke-opacity="0.7"/><text x="305" y="341" class="mrol" fill="#fca5a5" style="font-size:12px; font-weight:700">gpt-4.1-mini</text><text x="540" y="342" class="brol">Azure AI Foundry multi-tool</text><text x="850" y="342" class="mrol" fill="#9aa4b2" style="font-size:11.5px">azure</text><rect x="24" y="360" width="952" height="34" rx="6" fill="#0d1117" fill-opacity="0.75" stroke="#dc2626" stroke-opacity="0.15"/><text x="40" y="382" style="font: 600 14px 'Segoe UI', Ubuntu, 'Helvetica Neue', sans-serif; fill: #f0f6fc">Embeddings / RAG</text><rect x="294" y="367" width="201" height="20" rx="10" fill="#1a0507" stroke="#dc2626" stroke-opacity="0.7"/><text x="305" y="381" class="mrol" fill="#fca5a5" style="font-size:12px; font-weight:700">Titan Embed v2 · MiniLM</text><text x="540" y="382" class="brol">vector search &amp; retrieval</text><text x="850" y="382" class="mrol" fill="#9aa4b2" style="font-size:11.5px">novamart · eks</text><rect x="24" y="400" width="952" height="34" rx="6" fill="#0d1117" fill-opacity="0.95" stroke="#dc2626" stroke-opacity="0.15"/><text x="40" y="422" style="font: 600 14px 'Segoe UI', Ubuntu, 'Helvetica Neue', sans-serif; fill: #f0f6fc">Coding agents</text><rect x="294" y="407" width="170" height="20" rx="10" fill="#1a0507" stroke="#dc2626" stroke-opacity="0.7"/><text x="305" y="421" class="mrol" fill="#fca5a5" style="font-size:12px; font-weight:700">Claude Code · Codex</text><text x="540" y="422" class="brol">agentic software delivery</text><text x="850" y="422" class="mrol" fill="#9aa4b2" style="font-size:11.5px">daily driver</text>
