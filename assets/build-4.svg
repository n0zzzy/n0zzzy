    .bb4 { font: 400 13.5px 'Segoe UI', Ubuntu, 'Helvetica Neue', sans-serif; fill: #9aa4b2; }
    .mb4 { font: 500 13px 'Fira Code', Consolas, 'Courier New', monospace; }
    .tagb4 { font: 600 11px 'Fira Code', Consolas, 'Courier New', monospace; fill: #dc2626; letter-spacing: 2px; }
    .sweepb4 { animation: swb4 5s linear infinite; }
    @keyframes swb4 { from { transform: translateY(-40px); } to { transform: translateY(260px); } }
    .blinkb4 { animation: blb4 1s steps(1) infinite; }
    @keyframes blb4 { 50% { opacity: 0; } }
    .pulseb4 { animation: pub4 2.6s ease-in-out infinite; }
    @keyframes pub4 { 50% { stroke-opacity: 0.25; } }
  </style>
</defs>
<g clip-path="url(#clipb4)">
  <rect width="490" height="220" fill="url(#bgb4)"/>
