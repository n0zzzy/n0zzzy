  <rect x="34" y="168" width="74" height="24" rx="12" fill="#1a0507" stroke="#dc2626" stroke-opacity=".7"/><text x="71" y="184" text-anchor="middle" class="mb5" fill="#fca5a5" style="font-size:11.5px; font-weight:600">Strands</text><rect x="116" y="168" width="89" height="24" rx="12" fill="#1a0507" stroke="#dc2626" stroke-opacity=".7"/><text x="160" y="184" text-anchor="middle" class="mb5" fill="#fca5a5" style="font-size:11.5px; font-weight:600">AgentCore</text><rect x="212" y="168" width="66" height="24" rx="12" fill="#1a0507" stroke="#dc2626" stroke-opacity=".7"/><text x="246" y="184" text-anchor="middle" class="mb5" fill="#fca5a5" style="font-size:11.5px; font-weight:600">Lambda</text>
  <text x="456" y="184" text-anchor="end" class="mb5" fill="#fca5a5" style="font-size:11px; font-weight:700">OPEN ▸</text>
  
</g>
