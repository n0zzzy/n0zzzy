  <style>
    .tft { font: 700 17px 'Segoe UI', Ubuntu, 'Helvetica Neue', sans-serif; fill: #f0f6fc; }
    .bft { font: 400 13.5px 'Segoe UI', Ubuntu, 'Helvetica Neue', sans-serif; fill: #9aa4b2; }
    .mft { font: 500 13px 'Fira Code', Consolas, 'Courier New', monospace; }
    .tagft { font: 600 11px 'Fira Code', Consolas, 'Courier New', monospace; fill: #dc2626; letter-spacing: 2px; }
    .sweepft { animation: swft 5s linear infinite; }
    @keyframes swft { from { transform: translateY(-40px); } to { transform: translateY(230px); } }
    .blinkft { animation: blft 1s steps(1) infinite; }
    @keyframes blft { 50% { opacity: 0; } }
    .pulseft { animation: puft 2.6s ease-in-out infinite; }
    @keyframes puft { 50% { stroke-opacity: 0.25; } }
  </style>
