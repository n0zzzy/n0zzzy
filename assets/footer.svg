<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="190" viewBox="0 0 1000 190">
<defs><radialGradient id="moonft" cx=".5" cy=".3" r=".7"><stop offset="0" stop-color="#f87171"/><stop offset="1" stop-color="#991b1b"/></radialGradient><clipPath id="mclipft"><circle cx="860" cy="128" r="70"/></clipPath>
