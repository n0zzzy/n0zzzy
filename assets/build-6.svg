<svg xmlns="http://www.w3.org/2000/svg" width="490" height="220" viewBox="0 0 490 220">
<defs>
  <linearGradient id="bgb6" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#06080c"/><stop offset="0.6" stop-color="#0b0a10"/><stop offset="1" stop-color="#1c0609"/>
  </linearGradient>
  <radialGradient id="glowb6" cx="1" cy="0" r="0.9">
    <stop offset="0" stop-color="#dc2626" stop-opacity="0.28"/><stop offset="1" stop-color="#dc2626" stop-opacity="0"/>
  </radialGradient>
  <pattern id="gridb6" width="26" height="26" patternUnits="userSpaceOnUse">
    <path d="M26 0 L0 0 0 26" fill="none" stroke="#dc2626" stroke-opacity="0.07"/>
  </pattern>
  <pattern id="scanb6" width="4" height="4" patternUnits="userSpaceOnUse">
    <rect width="4" height="1" fill="#000" fill-opacity="0.35"/>
  </pattern>
  <clipPath id="clipb6"><rect width="490" height="220" rx="10"/></clipPath>
  <style>
    .tb6 { font: 700 17px 'Segoe UI', Ubuntu, 'Helvetica Neue', sans-serif; fill: #f0f6fc; }
    .bb6 { font: 400 13.5px 'Segoe UI', Ubuntu, 'Helvetica Neue', sans-serif; fill: #9aa4b2; }
    .mb6 { font: 500 13px 'Fira Code', Consolas, 'Courier New', monospace; }
    .tagb6 { font: 600 11px 'Fira Code', Consolas, 'Courier New', monospace; fill: #dc2626; letter-spacing: 2px; }
    .sweepb6 { animation: swb6 5s linear infinite; }
    @keyframes swb6 { from { transform: translateY(-40px); } to { transform: translateY(260px); } }
    .blinkb6 { animation: blb6 1s steps(1) infinite; }
    @keyframes blb6 { 50% { opacity: 0; } }
    .pulseb6 { animation: pub6 2.6s ease-in-out infinite; }
    @keyframes pub6 { 50% { stroke-opacity: 0.25; } }
  </style>
</defs>
<g clip-path="url(#clipb6)">
  <rect width="490" height="220" fill="url(#bgb6)"/>
  <rect width="490" height="220" fill="url(#gridb6)"/>
  <rect width="490" height="220" fill="url(#glowb6)"/>
  <rect width="490" height="220" fill="url(#scanb6)"/>
  <rect class="sweepb6" width="490" height="40" fill="#dc2626" fill-opacity="0.05"/>
  
  <rect x="16" y="44" width="458" height="160" rx="8" fill="#0d1117" fill-opacity="0.9" stroke="#dc2626" stroke-opacity="0.22"/>
