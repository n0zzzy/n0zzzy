  <rect x="34" y="168" width="44" height="24" rx="12" fill="#1a0507" stroke="#dc2626" stroke-opacity=".7"/><text x="56" y="184" text-anchor="middle" class="mb6" fill="#fca5a5" style="font-size:11.5px; font-weight:600">PWA</text><rect x="86" y="168" width="96" height="24" rx="12" fill="#1a0507" stroke="#dc2626" stroke-opacity=".7"/><text x="134" y="184" text-anchor="middle" class="mb6" fill="#fca5a5" style="font-size:11.5px; font-weight:600">Playwright</text><rect x="190" y="168" width="66" height="24" rx="12" fill="#1a0507" stroke="#dc2626" stroke-opacity=".7"/><text x="223" y="184" text-anchor="middle" class="mb6" fill="#fca5a5" style="font-size:11.5px; font-weight:600">Allure</text><rect x="265" y="168" width="66" height="24" rx="12" fill="#1a0507" stroke="#dc2626" stroke-opacity=".7"/><text x="298" y="184" text-anchor="middle" class="mb6" fill="#fca5a5" style="font-size:11.5px; font-weight:600">Vercel</text>
