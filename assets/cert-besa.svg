<svg xmlns="http://www.w3.org/2000/svg" width="490" height="150" viewBox="0 0 490 150">
<defs>
  <linearGradient id="bgcbesa" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#06080c"/><stop offset="0.6" stop-color="#0b0a10"/><stop offset="1" stop-color="#1c0609"/>
  </linearGradient>
  <radialGradient id="glowcbesa" cx="1" cy="0" r="0.9">
    <stop offset="0" stop-color="#dc2626" stop-opacity="0.28"/><stop offset="1" stop-color="#dc2626" stop-opacity="0"/>
  </radialGradient>
  <pattern id="gridcbesa" width="26" height="26" patternUnits="userSpaceOnUse">
    <path d="M26 0 L0 0 0 26" fill="none" stroke="#dc2626" stroke-opacity="0.07"/>
  </pattern>
  <pattern id="scancbesa" width="4" height="4" patternUnits="userSpaceOnUse">
    <rect width="4" height="1" fill="#000" fill-opacity="0.35"/>
  </pattern>
  <clipPath id="clipcbesa"><rect width="490" height="150" rx="10"/></clipPath>
  <style>
    .tcbesa { font: 700 17px 'Segoe UI', Ubuntu, 'Helvetica Neue', sans-serif; fill: #f0f6fc; }
    .bcbesa { font: 400 13.5px 'Segoe UI', Ubuntu, 'Helvetica Neue', sans-serif; fill: #9aa4b2; }
    .mcbesa { font: 500 13px 'Fira Code', Consolas, 'Courier New', monospace; }
    .tagcbesa { font: 600 11px 'Fira Code', Consolas, 'Courier New', monospace; fill: #dc2626; letter-spacing: 2px; }
    .sweepcbesa { animation: swcbesa 5s linear infinite; }
    @keyframes swcbesa { from { transform: translateY(-40px); } to { transform: translateY(190px); } }
    .blinkcbesa { animation: blcbesa 1s steps(1) infinite; }
    @keyframes blcbesa { 50% { opacity: 0; } }
    .pulsecbesa { animation: pucbesa 2.6s ease-in-out infinite; }
    @keyframes pucbesa { 50% { stroke-opacity: 0.25; } }
  </style>
</defs>
<g clip-path="url(#clipcbesa)">
  <rect width="490" height="150" fill="url(#bgcbesa)"/>
  <rect width="490" height="150" fill="url(#gridcbesa)"/>
  <rect width="490" height="150" fill="url(#glowcbesa)"/>
  <rect width="490" height="150" fill="url(#scancbesa)"/>
  <rect class="sweepcbesa" width="490" height="40" fill="#dc2626" fill-opacity="0.05"/>
  
  <rect x="16" y="40" width="458" height="94" rx="8" fill="#0d1117" fill-opacity="0.9" stroke="#dc2626" stroke-opacity="0.22"/>
  <rect x="32" y="54" width="66" height="66" rx="10" fill="#dc2626" class="pulsecbesa" stroke="#fca5a5" stroke-opacity="0.6"/>
