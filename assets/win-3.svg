  </linearGradient>
  <radialGradient id="glowv3" cx="1" cy="0" r="0.9">
    <stop offset="0" stop-color="#dc2626" stop-opacity="0.28"/><stop offset="1" stop-color="#dc2626" stop-opacity="0"/>
  </radialGradient>
  <pattern id="gridv3" width="26" height="26" patternUnits="userSpaceOnUse">
