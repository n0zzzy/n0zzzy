    .tagv3 { font: 600 11px 'Fira Code', Consolas, 'Courier New', monospace; fill: #dc2626; letter-spacing: 2px; }
    .sweepv3 { animation: swv3 5s linear infinite; }
    @keyframes swv3 { from { transform: translateY(-40px); } to { transform: translateY(380px); } }
    .blinkv3 { animation: blv3 1s steps(1) infinite; }
    @keyframes blv3 { 50% { opacity: 0; } }
    .pulsev3 { animation: puv3 2.6s ease-in-out infinite; }
    @keyframes puv3 { 50% { stroke-opacity: 0.25; } }
  </style>
</defs>
