  </linearGradient>
  <radialGradient id="glowv2" cx="1" cy="0" r="0.9">
    <stop offset="0" stop-color="#dc2626" stop-opacity="0.28"/><stop offset="1" stop-color="#dc2626" stop-opacity="0"/>
  </radialGradient>
  <pattern id="gridv2" width="26" height="26" patternUnits="userSpaceOnUse">
    <path d="M26 0 L0 0 0 26" fill="none" stroke="#dc2626" stroke-opacity="0.07"/>
  </pattern>
  <pattern id="scanv2" width="4" height="4" patternUnits="userSpaceOnUse">
