    .tagv2 { font: 600 11px 'Fira Code', Consolas, 'Courier New', monospace; fill: #dc2626; letter-spacing: 2px; }
    .sweepv2 { animation: swv2 5s linear infinite; }
    @keyframes swv2 { from { transform: translateY(-40px); } to { transform: translateY(380px); } }
    .blinkv2 { animation: blv2 1s steps(1) infinite; }
    @keyframes blv2 { 50% { opacity: 0; } }
    .pulsev2 { animation: puv2 2.6s ease-in-out infinite; }
    @keyframes puv2 { 50% { stroke-opacity: 0.25; } }
  </style>
</defs>
