  <rect x="34" y="168" width="44" height="24" rx="12" fill="#1a0507" stroke="#dc2626" stroke-opacity=".7"/><text x="56" y="184" text-anchor="middle" class="mb3" fill="#fca5a5" style="font-size:11.5px; font-weight:600">EKS</text><rect x="86" y="168" width="96" height="24" rx="12" fill="#1a0507" stroke="#dc2626" stroke-opacity=".7"/><text x="134" y="184" text-anchor="middle" class="mb3" fill="#fca5a5" style="font-size:11.5px; font-weight:600">Kubernetes</text><rect x="190" y="168" width="74" height="24" rx="12" fill="#1a0507" stroke="#dc2626" stroke-opacity=".7"/><text x="227" y="184" text-anchor="middle" class="mb3" fill="#fca5a5" style="font-size:11.5px; font-weight:600">LiteLLM</text><rect x="272" y="168" width="89" height="24" rx="12" fill="#1a0507" stroke="#dc2626" stroke-opacity=".7"/><text x="316" y="184" text-anchor="middle" class="mb3" fill="#fca5a5" style="font-size:11.5px; font-weight:600">Terraform</text>
  <text x="456" y="184" text-anchor="end" class="mb3" fill="#fca5a5" style="font-size:11px; font-weight:700">OPEN ▸</text>
  
</g>
<rect x="0.5" y="0.5" width="489" height="219" rx="10" fill="none" stroke="#dc2626" stroke-opacity="0.45" class="pulseb3"/>
<g stroke="#dc2626" stroke-width="3" fill="none" stroke-linecap="square">
  <path d="M2 20 V2 H20"/><path d="M470 2 H488 V20"/>
  <path d="M2 200 V218 H20"/><path d="M470 218 H488 V200"/>
</g>
